<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b1a"><title>KIN — living pond</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1715;color:#e7ddc1;font-family:Georgia,'Times New Roman',serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:2;inset:0;pointer-events:none;padding:clamp(18px,3vw,42px);display:flex;flex-direction:column;justify-content:space-between}.brand{letter-spacing:.28em;font-size:12px;text-transform:uppercase}.brand b{font-size:24px;display:block;letter-spacing:.12em;font-weight:400;margin-bottom:5px}.help{align-self:flex-end;text-align:right;font:11px/1.65 system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;opacity:.72}.seal{display:inline-grid;place-items:center;width:31px;height:31px;border:1px solid #c34c3c;color:#d66a58;margin-bottom:9px}.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}</style></head><body><canvas id="pond"></canvas><div class="grain"></div><div class="ui"><div class="brand"><b>KIN</b>living pond / 01</div><div class="help"><span class="seal">魚</span><br>tap water to feed<br>move gently to stir</div></div><script>
const C=document.querySelector('#pond'),X=C.getContext('2d');let W,H,D=Math.min(devicePixelRatio,2),T=0,last=performance.now(),pointer={x:0,y:0,down:false};
let ripples=[],food=[],bubbles=[];const TAU=Math.PI*2,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);if(!pointer.x){pointer.x=W*.6;pointer.y=H*.5}}addEventListener('resize',resize);resize();
function hash(x,y){return (Math.sin(x*127.1+y*311.7)*43758.5453)%1}
class Fish{constructor(x,y,s,hue=18){this.x=x;this.y=y;this.s=s;this.a=Math.random()*TAU;this.speed=22+Math.random()*14;this.turn=0;this.target={x:W*.5,y:H*.5};this.phase=Math.random()*TAU;this.hue=hue;this.history=[];for(let i=0;i<18;i++)this.history.push({x,y,a:this.a})}
think(){let target=food[0];if(target){this.target=target;return}if(Math.random()<.007||Math.hypot(this.x-this.target.x,this.y-this.target.y)<70)this.target={x:W*(.12+Math.random()*.76),y:H*(.16+Math.random()*.68)}}
update(dt){this.think();let dx=this.target.x-this.x,dy=this.target.y-this.y,desired=Math.atan2(dy,dx),da=Math.atan2(Math.sin(desired-this.a),Math.cos(desired-this.a));let edge=Math.min(this.x,this.y,W-this.x,H-this.y);if(edge<80){desired=Math.atan2(H/2-this.y,W/2-this.x);da=Math.atan2(Math.sin(desired-this.a),Math.cos(desired-this.a))}this.turn=lerp(this.turn,clamp(da,-1.5,1.5),dt*1.8);this.a+=this.turn*dt;let seek=food.length?1.5:1;this.speed=lerp(this.speed,(26+Math.sin(T*.6+this.phase)*7)*seek,dt);this.x+=Math.cos(this.a)*this.speed*dt;this.y+=Math.sin(this.a)*this.speed*dt;this.x=clamp(this.x,30,W-30);this.y=clamp(this.y,30,H-30);this.history.unshift({x:this.x,y:this.y,a:this.a});this.history.pop();if(Math.random()<.022)ripples.push({x:this.x,y:this.y,r:2,life:1,a:.16});if(food[0]&&Math.hypot(dx,dy)<20){food.shift();for(let i=0;i<9;i++)bubbles.push({x:this.x,y:this.y,r:1+Math.random()*3,v:10+Math.random()*20,life:1});ripples.push({x:this.x,y:this.y,r:4,life:1,a:.7})}}
bodyPoint(i){let h=this.history[Math.min(i,this.history.length-1)],wave=Math.sin(T*4.5+this.phase-i*.58)*i*.52;return{x:h.x+Math.cos(h.a+Math.PI/2)*wave,y:h.y+Math.sin(h.a+Math.PI/2)*wave,a:h.a}}
draw(){let pts=[];for(let i=0;i<12;i++)pts.push(this.bodyPoint(i));X.save();X.globalCompositeOperation='source-over';// shadow
X.beginPath();X.ellipse(this.x+12,this.y+17,this.s*1.08,this.s*.34,this.a,0,TAU);X.fillStyle='rgba(0,0,0,.18)';X.fill();
// flowing fins behind
let p=this.bodyPoint(3),flap=Math.sin(T*5+this.phase)*.55;for(let side of [-1,1]){let ang=p.a+side*(1.45+flap*.25);X.beginPath();X.moveTo(p.x,p.y);X.quadraticCurveTo(p.x+Math.cos(ang)*this.s*.75,p.y+Math.sin(ang)*this.s*.75,p.x+Math.cos(p.a+side*2.15)*this.s*.92,p.y+Math.sin(p.a+side*2.15)*this.s*.92);X.quadraticCurveTo(p.x-Math.cos(p.a)*this.s*.15,p.y-Math.sin(p.a)*this.s*.15,p.x,p.y);X.fillStyle='rgba(226,106,50,.42)';X.fill();X.strokeStyle='rgba(255,210,146,.27)';X.stroke()}
// articulated body ribbon
X.beginPath();for(let side of [-1,1]){let seq=side===-1?pts:pts.slice().reverse();seq.forEach((q,j)=>{let idx=side===-1?j:pts.length-1-j,rad=this.s*(.48*Math.sin((1-idx/15)*Math.PI*.74)+.07);let xx=q.x+Math.cos(q.a+Math.PI/2)*rad*side,yy=q.y+Math.sin(q.a+Math.PI/2)*rad*side;if(side===-1&&j===0)X.moveTo(xx,yy);else X.lineTo(xx,yy)})}X.closePath();let g=X.createLinearGradient(this.x-this.s,this.y-this.s,this.x+this.s,this.y+this.s);g.addColorStop(0,'#f6c56e');g.addColorStop(.34,'#d95327');g.addColorStop(.72,'#a82718');g.addColorStop(1,'#562017');X.fillStyle=g;X.fill();X.strokeStyle='rgba(255,224,159,.5)';X.lineWidth=.8;X.stroke();
// scales / white belly
X.globalAlpha=.4;for(let i=1;i<8;i++){let q=pts[i];X.beginPath();X.arc(q.x+Math.cos(q.a+Math.PI/2)*this.s*.08,q.y+Math.sin(q.a+Math.PI/2)*this.s*.08,this.s*(.18-i*.012),0,TAU);X.strokeStyle=i%2?'#f8d693':'#8e241c';X.stroke()}X.globalAlpha=1;
// forked translucent tail at chain end
let q=pts[11],ta=q.a+Math.PI,tw=Math.sin(T*5+this.phase)*.4;for(let side of [-1,1]){let aa=ta+side*(.65+tw*.28);X.beginPath();X.moveTo(q.x,q.y);X.quadraticCurveTo(q.x+Math.cos(ta)*this.s*.7,q.y+Math.sin(ta)*this.s*.7,q.x+Math.cos(aa)*this.s*1.2,q.y+Math.sin(aa)*this.s*1.2);X.quadraticCurveTo(q.x+Math.cos(ta)*this.s*.38,q.y+Math.sin(ta)*this.s*.38,q.x,q.y);X.fillStyle='rgba(205,66,35,.54)';X.fill();X.strokeStyle='rgba(255,188,111,.38)';X.stroke()}
// eyes
for(let side of [-1,1]){let ex=this.x+Math.cos(this.a)*this.s*.34+Math.cos(this.a+Math.PI/2)*side*this.s*.25,ey=this.y+Math.sin(this.a)*this.s*.34+Math.sin(this.a+Math.PI/2)*side*this.s*.25;X.beginPath();X.arc(ex,ey,this.s*.055,0,TAU);X.fillStyle='#15100c';X.fill()}X.restore()}}
let fishes=[new Fish(W*.36,H*.45,45,12),new Fish(W*.66,H*.58,34,27),new Fish(W*.55,H*.28,29,5)];
function plant(x,y,s,a){X.save();X.translate(x,y);X.rotate(a+Math.sin(T*.7+x)*.04);for(let i=0;i<5;i++){let aa=-1.4+i*.7+Math.sin(T*.55+i)*.08;X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(Math.cos(aa)*s*.45,Math.sin(aa)*s*.45,Math.cos(aa)*s,Math.sin(aa)*s);X.lineWidth=3-i*.2;X.strokeStyle=`rgba(${33+i*5},${73+i*10},${50+i*5},.72)`;X.stroke();X.beginPath();X.ellipse(Math.cos(aa)*s*.72,Math.sin(aa)*s*.72,s*.21,s*.07,aa,0,TAU);X.fillStyle='rgba(55,93,63,.56)';X.fill()}X.restore()}
function background(){let g=X.createRadialGradient(W*.45,H*.35,0,W*.5,H*.5,Math.max(W,H)*.8);g.addColorStop(0,'#526f5d');g.addColorStop(.45,'#263f38');g.addColorStop(1,'#0a1817');X.fillStyle=g;X.fillRect(0,0,W,H);
// pond-floor stone wash
X.globalAlpha=.18;for(let i=0;i<34;i++){let x=(i*137)%W,y=(i*271)%H,r=20+(i*17)%75;X.beginPath();X.ellipse(x,y,r,r*.55,hash(i,2)*3,0,TAU);X.fillStyle=i%3?'#a99d78':'#384f40';X.fill()}X.globalAlpha=1;
// procedural caustics
X.save();X.globalCompositeOperation='screen';X.strokeStyle='rgba(216,238,177,.105)';X.lineWidth=1.3;for(let j=0;j<16;j++){X.beginPath();for(let i=0;i<=40;i++){let x=i/40*W,y=(j/15)*H+Math.sin(i*.72+T*1.25+j)*10+Math.sin(i*.23-T*.7)*9;i?X.lineTo(x,y):X.moveTo(x,y)}X.stroke()}for(let i=0;i<23;i++){let x=(i*113+T*12)%W,y=(i*241+Math.sin(T+i)*30)%H;X.beginPath();X.ellipse(x,y,22+10*Math.sin(T+i),6+3*Math.cos(T*.7+i),T*.2+i,0,TAU);X.stroke()}X.restore();
// lily pads
[[.18,.22,46],[.82,.18,33],[.78,.79,50],[.14,.74,29]].forEach((v,i)=>{let x=v[0]*W,y=v[1]*H,r=v[2];X.beginPath();X.arc(x,y,r,0,TAU-.48);X.lineTo(x,y);X.closePath();X.fillStyle='rgba(45,79,52,.88)';X.fill();X.strokeStyle='rgba(142,163,106,.35)';X.stroke();if(i===0||i===2){for(let k=0;k<7;k++){X.beginPath();X.ellipse(x+Math.cos(k*TAU/7)*9,y+Math.sin(k*TAU/7)*9,8,3,k*TAU/7,0,TAU);X.fillStyle=k%2?'#eadac0':'#d6aeb1';X.fill()}X.beginPath();X.arc(x,y,5,0,TAU);X.fillStyle='#d9b45b';X.fill()}});plant(W*.07,H*.58,85,-.2);plant(W*.93,H*.62,92,3.2)}
function water(){for(let r of ripples){X.beginPath();X.ellipse(r.x,r.y,r.r,r.r*.42,0,0,TAU);X.strokeStyle=`rgba(226,239,211,${r.life*r.a})`;X.lineWidth=1.2;X.stroke();r.r+=45/60;r.life-=.009}ripples=ripples.filter(r=>r.life>0&&r.r<160);for(let f of food){X.beginPath();X.arc(f.x,f.y,2.7,0,TAU);X.fillStyle='#d0a75f';X.fill()}for(let b of bubbles){b.y-=b.v/60;b.life-=.012;X.beginPath();X.arc(b.x,b.y,b.r,0,TAU);X.strokeStyle=`rgba(236,242,218,${b.life*.5})`;X.stroke()}bubbles=bubbles.filter(b=>b.life>0)}
function frame(now){let dt=Math.min((now-last)/1000,.033);last=now;T=now/1000;background();fishes.forEach(f=>f.update(dt));fishes.slice().sort((a,b)=>a.y-b.y).forEach(f=>f.draw());water();X.fillStyle='rgba(5,20,18,.08)';X.fillRect(0,0,W,H);requestAnimationFrame(frame)}requestAnimationFrame(frame);
function point(e){let p=e.touches?e.touches[0]:e;return{x:p.clientX,y:p.clientY}}function drop(e){e.preventDefault();let p=point(e);pointer=p;food.push({x:p.x,y:p.y});if(food.length>4)food.shift();ripples.push({x:p.x,y:p.y,r:4,life:1,a:.72})}C.addEventListener('pointerdown',drop);C.addEventListener('pointermove',e=>{let p=point(e);if(Math.hypot(p.x-pointer.x,p.y-pointer.y)>18){ripples.push({x:p.x,y:p.y,r:2,life:.65,a:.25});pointer=p}});C.addEventListener('touchstart',drop,{passive:false});
</script></body></html>
