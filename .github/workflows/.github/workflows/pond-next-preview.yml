# KIN Pond Next - preview deploy (NOT ENABLED)
#
# Builds the "Web Next" export from the godot-prototype branch and publishes
# it to /next/ on the Pages site (https://aeiouvcode.github.io/kin-living-pond/next/).
# The live /godot/ build and the root index.html are never touched: the job
# fails if anything outside next/ would change.
#
# Why nothing runs yet:
# - The only trigger is manual (workflow_dispatch). GitHub only offers manual
#   runs for workflow files that exist on the default branch (main). This file
#   lives on godot-prototype only, so it cannot run until it is copied to main,
#   which waits for the owner's go.
# - Even then a run must type "deploy-next" in the confirm box.
#
# Supply chain: Godot 4.5.2 and its web template come from the official
# godotengine/godot-builds release and are checked against pinned SHA-256
# sums before use. No other downloads, no secrets beyond the built-in token.

name: KIN Pond Next preview (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-next to build godot-prototype and publish it to /next/'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: pond-next-preview
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.2-stable
  GODOT_ZIP_SHA256: 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
  WEB_TEMPLATE_SHA256: 5f202410b79f15d31bfef4c434ee7b7bcc964b50a587bb1338cb53ad9d94c61b

jobs:
  build-and-publish:
    if: ${{ github.event.inputs.confirm == 'deploy-next' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push next/ to main
    steps:
      - name: Check out godot-prototype (source)
        uses: actions/checkout@v4
        with:
          ref: godot-prototype
          path: src
          persist-credentials: false

      - name: Get Godot and the web template (pinned)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot && chmod +x godot
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d tpl
          echo "${WEB_TEMPLATE_SHA256}  tpl/web_nothreads_release.zip" | sha256sum -c -
          dest="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mkdir -p "$dest" && cp tpl/web_nothreads_release.zip tpl/version.txt "$dest/"
          rm -f templates.tpz

      - name: Build Web Next
        working-directory: src/godot
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/godot" --headless --import || true
          GODOT="$GITHUB_WORKSPACE/godot" sh build.sh "Web Next"
          test -s export_next/index.wasm
          test -s export_next/index.pck
          grep -q 'Content-Security-Policy' export_next/index.html
          grep -q "default-src 'none'" export_next/index.html
          rm -f export_next/.gdignore export_next/*.import
          ls -la export_next

      - name: Check out main (site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Publish to next/ only
        working-directory: site
        run: |
          set -euo pipefail
          rm -rf next
          mkdir next
          cp -R ../src/godot/export_next/. next/
          git add -A next
          # guard: nothing outside next/ may change (live /godot/ and index.html stay as they are)
          if git diff --cached --name-only | grep -v '^next/'; then
            echo "Refusing: changes outside next/"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "next/ already up to date"; exit 0
          fi
          src_sha=$(git -C ../src rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pond Next preview: godot-prototype ${src_sha} into /next/"
          git push origin HEAD:main
